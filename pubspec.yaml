name: infinity_world
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
    sdk: ^3.7.0

dependencies:
    flutter:
        sdk: flutter
    change_app_package_name: ^1.5.0
    get: ^4.7.2
    http: ^1.3.0

dev_dependencies:
    flutter_test:
        sdk: flutter
    flutter_lints: ^5.0.0

flutter:
    uses-material-design: true
    assets:
        - assets/images/
    fonts:
        - family: Inter
          fonts:
              - asset: assets/fonts/Inter/Inter_18pt-Regular.ttf
                weight: 400
              - asset: assets/fonts/Inter/Inter_18pt-Medium.ttf
                weight: 500
              - asset: assets/fonts/Inter/Inter_18pt-SemiBold.ttf
                weight: 600
              - asset: assets/fonts/Inter/Inter_18pt-Bold.ttf
                weight: 700
        - family: Sora
          fonts:
              - asset: assets/fonts/Sora/Sora-Regular.ttf
                weight: 400
              - asset: assets/fonts/Sora/Sora-Medium.ttf
                weight: 500
              - asset: assets/fonts/Sora/Sora-SemiBold.ttf
                weight: 600
              - asset: assets/fonts/Sora/Sora-Bold.ttf
                weight: 700
